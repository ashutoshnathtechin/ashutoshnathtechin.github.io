<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashutosh Nath | Portfolio</title>
    <meta name="description" content="Portfolio of Ashutosh Nath, built dynamically with GitHub API.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="container">
        <header id="profile-header" class="glass-panel">
            <div class="loader"></div>
        </header>
        
        <main>
            <section id="repositories-section">
                <h2><i class="fa-solid fa-code-branch"></i> Projects & Repositories</h2>
                <div id="repos-grid" class="repos-grid">
                    <div class="loader"></div>
                </div>
            </section>
        </main>
        
        <footer class="glass-panel">
            <p>&copy; <span id="current-year"></span> Ashutosh Nath. Data fetched live from GitHub.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
